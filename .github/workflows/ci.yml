name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:check
      - name: Content check of the e2e fixture tree
        run: pnpm --filter @tekom/website content:check ../../tests/fixtures/content
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the real content
        run: pnpm build
      # Request-only checks: no browser is needed. The e2e job runs on fixture content, so this is where real pages are guarded.
      - name: Every published page is ready for search
        run: |
          pnpm --filter @tekom/website start --port 3000 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          SITE_URL=http://localhost:3000 pnpm --filter @tekom/tests test:smoke seo.spec.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tekom/tests exec playwright install --with-deps chromium firefox webkit
      # The Playwright web server builds and serves tests/fixtures/content (CONTENT_ROOT), not content/.
      - run: pnpm --filter @tekom/tests test:e2e
        env:
          CI: 'true'
