name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:check
      - name: Content check of the e2e fixture tree
        run: pnpm --filter @tekom/website content:check ../../tests/fixtures/content
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the real content
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tekom/tests exec playwright install --with-deps chromium
      # The Playwright web server builds and serves tests/fixtures/content (CONTENT_ROOT), not content/.
      - run: pnpm --filter @tekom/tests test:e2e
        env:
          CI: 'true'
