- code: BG05SFPR002-1.004-1772-C01
  title:
    bg: Програма „Развитие на човешките ресурси“ 2021–2027
    en: Programme Human Resources Development 2021–2027
    de: Programm Entwicklung der Humanressourcen 2021–2027
  summary:
    bg: |-
      „ТЕКОМ“ ООД изпълнява проект по процедура BG05SFPR002-1.004 „Адаптирана работна среда“ по Оперативна програма „Развитие на човешките ресурси“ 2021-2027, съфинансирано от Европейския съюз. Дружеството сключи договор за предоставяне на безвъзмездна финансова помощ № BG05SFPR002-1.004-1772-C01 с наименование: „Адаптирана работна среда в „ТЕКОМ“ ООД“.

      Обща стойност на проекта: 343 385,03 лв., от които 291 877,28 лв. европейско и 51 507,75 лв. национално съфинансиране

      Начална дата на изпълнение на проекта: 01.02.2025 г.
      Крайна дата на изпълнение на проекта: 01.08.2026 г.

      Дейностите по проекта са:
      - Разработване и прилагане на „зелени“ модели на организация на труд съобразно спецификата на конкретните работни места в предприятията. Изготвяне на „зелени“ карти за организация на работни процеси на конкретните работни места. Обучение на лицата от целевата група насочено към внедряване на „зелени“ модели на организация на труд.
      - Закупуване на лични предпазни средства (ЛПС) и специално работно облекло.
      - Осигуряване на колективни предпазни средства, вкл. модернизация и/или реконструкция, и/или обезопасяване на съществуващи обекти, технологични процеси, машини и съоръжения, свързани с подобряване условията на труд.
      - Осигуряване на социални придобивки за работещите, вкл. ремонт и оборудване на места за отдих, рехабилитация, спорт, хранене и почивка в предприятията и др.
  objectives:
    bg: |-
      Общата цел на проекта е:
      Осигуряване на предпоставки за посрещане на новите предизвикателства, свързани с осъществяването на прехода към климатично неутрална икономика и променящите се модели на работа, както и за предприемане на ефективни мерки за подобряване на достъпа до трудова заетост на качествени работни места и адаптиране към промените в работната среда.

      Специфичните цели на проекта са:
      - Посрещане на новите предизвикателства, свързани с осъществяването на прехода към климатично неутрална икономика и променящите се модели на работа чрез дейност за разработване и прилагане на „зелени“ модели на организация на труд съобразно спецификата на конкретните работни места в предприятието, изготвяне на „зелени“ карти за организация на работни процеси на конкретните работни места и обучение на лицата от целевата група, насочено към внедряване на „зелени“ модели на организация на труд.
      - Предприемане на ефективни мерки, в контекста на бързи промени в пазара на труда, за подобряване на достъпа до трудова заетост на качествени работни места и адаптиране към промените в работната среда чрез реализация на дейности за осигуряване на ЛПС и на колективни предпазни средства, както и на дейност за осигуряване на социални придобивки за работещите.
      - Подобряване на здравословната и безопасна работна среда в предприятията, което е ключов елемент за постигането на устойчиви условия на труд за всички работници, чрез реализация на дейности за осигуряване на ЛПС, на колективни предпазни средства, на социални придобивки за работещите.
      - Намаляване на рисковете за здравето на работното място и подобряване на стандартите за здравословни и безопасни условия на труд чрез реализация на планираните дейности по проекта.
  results:
    bg: |-
      Очакваните резултати по проекта са:
      Подобряване на здравословната и безопасна работна среда в предприятието, което е ключов елемент за постигането на устойчиви условия на труд за всички работници, спомагайки за намаляване на рисковете за здравето на работното място и за подобряване на стандартите за ЗБУТ.
  total_budget_eur: 175569.98
  eu_contribution_eur: 149234.48
  period_start: 2025-02-01
  period_end: 2026-08-01
  programme_logo: eu-programmes/oprchr-logo.png
- code: BG16RFPR001-1.004
  title:
    bg: Програма „Конкурентоспособност и иновации в предприятията“
    en: Programme Competitiveness and Innovation in Enterprises
    de: Programm Wettbewerbsfähigkeit und Innovation
  summary:
    bg: |-
      ТЕКОМ ООД изпълнява проект по процедура BG16RFPR001-1.004 „Подкрепа за семейните предприятия, предприятията от творческите индустрии и занаятите“ по програма „Конкурентоспособност и иновации в предприятията“ 2021-2027

      Проект № BG16RFPR001-1.004-1277-C01 с наименование: „Подкрепа за ТЕКОМ ООД“ и главна цел: реализация на инвестиции за подобряване на производствения капацитет и оптимизиране на бизнес процесите в семейните предприятия, предприятията от творческите индустрии и занаятите, и по този начин да се осигурят предпоставки за повишаване на конкурентоспособността и засилване на пазарното присъствие на фирмата.

      Обща стойност: 110 661,00 лв., от които 70 546,38 лв. европейско и 12 449,37 лв. национално съфинансиране

      Начална дата на изпълнение на проекта: 04.06.2025 г.
      Крайна дата на изпълнение на проекта: 04.06.2026 г.

      Дейностите по проекта включват:
      - Дейност 1. Подобряване на производствения капацитет на семейните предприятия и предприятията от творческите индустрии и занаятите.
      - Дейност 4. Консултантски услуги за подготовка на проектното предложение по процедурата.
  objectives:
    bg: |-
      Специфичните цели на проекта са:
      - Подобряване на производствения капацитет и оптимизиране на бизнес процесите в ТЕКОМ ООД чрез инвестиции в активи, които да повишат производствения капацитет и ефективността на бизнес процесите във фирмата.
      - Повишаване на конкурентоспособността и засилване на пазарното присъствие на ТЕКОМ ООД посредством целенасочени инвестиции за подобряване на производствения капацитет и оптимизиране на бизнес процесите в компанията.
      - Осигуряване на условия за устойчивост и растеж на ТЕКОМ ООД като част от семейните предприятия, предприятията от творческите индустрии и занаятите посредством инвестиции за подобряване на производствения капацитет и оптимизиране на бизнес процесите във фирмата.
      - Реализиране на инвестиции за подобряване на производствения капацитет и оптимизиране на бизнес процесите в ТЕКОМ ООД, които да допринесат за повишаване на конкурентоспособността и засилване на пазарното присъствие на фирмата.
  results:
    bg: |-
      Очаквани резултати от изпълнението на проекта:
      - повишен брой на семейните предприятия, предприятията от творческите индустрии и занаятите, които увеличават производствения си капацитет и ефективността на процесите, и по този начин постигат подобряване на пазарното присъствие и развитие на потенциала им за устойчивост и растеж.
      - увеличен производствен капацитет и ефективност на процесите в ТЕКОМ ООД
      - подобрено пазарно присъствие на ТЕКОМ ООД
      - създадени условия за развитие на потенциала на ТЕКОМ ООД за устойчивост и растеж.
  total_budget_eur: 56580.07
  eu_contribution_eur: 36069.79
  period_start: 2025-06-04
  period_end: 2026-06-04
  programme_logo: eu-programmes/pkip.png
