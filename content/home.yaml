rail_panels:
  - kind: capability
    after_project_index: 0
    accent: true
    label:
      bg: Наш екип
      en: Our own crew
      de: Eigenes Team
    title:
      bg: Фасади
      en: Facades
      de: Fassaden
    body:
      bg: Топлоизолации, декоративни мазилки и каменни облицовки от нашия фасаден екип, по системата на производителя, за да важи гаранцията.
      en: Insulation systems, decorative plaster and stone cladding by our own facade crew, built to the manufacturer's system so the warranty holds.
      de: Dämmsysteme, Dekorputz und Steinverkleidung von unserem eigenen Fassadenteam, nach Herstellersystem, damit die Garantie gilt.
  - kind: capability
    after_project_index: 1
    accent: false
    label:
      bg: Същият екип, отвътре
      en: Same crew, inside
      de: Dasselbe Team, innen
    title:
      bg: Интериори и бояджийски работи
      en: Interiors & painting
      de: Innenausbau & Malerarbeiten
    body:
      bg: Шпакловки, боя, плочки и камък, завършени от едни и същи хора от първата до последната стая.
      en: Plaster, paint, tile and stone, finished by the same people from the first room to the last.
      de: Putz, Farbe, Fliesen und Stein, vom ersten bis zum letzten Raum von denselben Leuten ausgeführt.
  - kind: capability
    after_project_index: 2
    accent: false
    label:
      bg: Наш екип
      en: Our own crew
      de: Eigenes Team
    title:
      bg: Строим от нулата
      en: Built from scratch
      de: Neubau von Grund auf
    body:
      bg: Основи, конструкция, зидария и покрив. Сградата е наша отговорност от първия бетон до предаването на ключа.
      en: Foundations, structure, masonry and roof. The building is ours from the first pour to the handover of the keys.
      de: Fundament, Tragwerk, Mauerwerk und Dach. Vom ersten Beton bis zur Schlüsselübergabe in unserer Verantwortung.
  - kind: crew_stat
    after_project_index: 3
    stat_value: "{years}"
    unit:
      bg: години на обекта
      en: years on site
      de: Jahre auf der Baustelle
    body:
      bg: Семейна фирма от Стара Загора. Хората, които започват проекта Ви, са хората, които го завършват.
      en: A family company from Stara Zagora. The people who start your project are the people who finish it.
      de: Ein Familienunternehmen aus Stara Sagora. Wer Ihr Projekt beginnt, beendet es auch.
    unconfirmed: false
  - kind: capability
    after_project_index: 4
    accent: false
    label:
      bg: Нашите партньори
      en: Our partners
      de: Unsere Partner
    title:
      bg: Най-добрите за останалото
      en: The best people for the rest
      de: Die Besten für den Rest
    body:
      bg: Дограма, кухни, инсталации, озеленяване. Включваме партньори, на които имаме доверие, и ги координираме на обекта Ви.
      en: Windows, kitchens, installations, landscaping. We bring in partners we trust and coordinate them on your site.
      de: Fenster, Küchen, Installationen, Gartenbau. Wir holen Partner, denen wir vertrauen, und koordinieren sie auf Ihrer Baustelle.
  - kind: capability
    after_project_index: 8
    accent: false
    label:
      bg: Какво правим
      en: What we do
      de: Was wir tun
    title:
      bg: Реставрация
      en: Restoration
      de: Restaurierung
    body:
      bg: Къщи от кирпич, баня от 1929 г., параклис с тухлен купол. Пазим това, което прави сградата ценна.
      en: Adobe houses, a 1929 bathhouse, a brick-domed chapel. We keep what makes a building worth saving.
      de: Lehmhäuser, ein Badehaus von 1929, eine Kapelle mit Ziegelkuppel. Wir bewahren, was ein Gebäude wertvoll macht.
  - kind: crew_stat
    after_project_index: 9
    stat_value: "1"
    unit:
      bg: екип, от основите до ключ
      en: crew, foundations to finish
      de: Team, vom Fundament bis zur Übergabe
    body:
      bg: Конструкция, фасади и довършителни работи от нашите хора. Партньори само там, където специалист го прави по-добре.
      en: Structure, facades and finishing by our own people. Partners only where a specialist does it better.
      de: Rohbau, Fassaden und Ausbau mit eigenen Leuten. Partner nur dort, wo ein Spezialist es besser kann.
    unconfirmed: false
  - kind: capability
    after_project_index: 11
    accent: false
    label:
      bg: Как работим
      en: How we work
      de: Wie wir arbeiten
    title:
      bg: Виждате обекта си всеки ден
      en: You see your site every day
      de: Ihre Baustelle, jeden Tag sichtbar
    body:
      bg: Ежедневни снимки, протоколи и материали в общ дневник. Без изненади при предаването.
      en: Daily photos, protocols and materials in one shared log. No surprises at handover.
      de: Tägliche Fotos, Protokolle und Material in einem gemeinsamen Log. Keine Überraschungen bei der Übergabe.
promises:
  - title:
      bg: Цена, на която можете да разчитате
      en: A price you can plan on
      de: Ein Preis, mit dem Sie planen können
    body:
      bg: Количествата се вземат от проекта и се договарят преди началото, а не се откриват на обекта.
      en: Quantities taken from the drawings and agreed before work starts, not discovered on site.
      de: Mengen aus den Plänen, vor Baubeginn vereinbart, nicht erst auf der Baustelle entdeckt.
  - title:
      bg: Изпълнено правилно
      en: Done the right way
      de: Richtig ausgeführt
    body:
      bg: Всеки слой по системата на производителя и българските норми, с проследими материали.
      en: Every layer to the manufacturer's system and Bulgarian standards, with materials you can trace.
      de: Jede Schicht nach Herstellersystem und bulgarischer Norm, mit nachverfolgbarem Material.
  - title:
      bg: Нищо скрито
      en: Nothing hidden
      de: Nichts verdeckt
    body:
      bg: "Ежедневни снимки и протоколи за всичко, което ще бъде покрито: изолации, хидроизолации, инсталации."
      en: "Daily photos and protocols of everything that gets covered up: insulation, waterproofing, installations."
      de: "Tägliche Fotos und Protokolle von allem, was später verdeckt wird: Dämmung, Abdichtung, Installationen."
  - title:
      bg: Предаване без изненади
      en: Handover without surprises
      de: Übergabe ohne Überraschungen
    body:
      bg: Приемане стая по стая, с документи и гаранции на едно място.
      en: Signed off room by room, with documents and warranties in one place.
      de: Raumweise Abnahme, Unterlagen und Garantien an einem Ort.
stats:
  - value: "{years}"
    label:
      bg: години строим в Стара Загора
      en: years building in Stara Zagora
      de: Jahre Bauen in Stara Sagora
    unconfirmed: false
  - value: 24 000
    label:
      bg: м² РЗП в показаните проекти
      en: m² built on the projects shown here
      de: m² Fläche der gezeigten Projekte
    unconfirmed: false
  - value: "17"
    label:
      bg: сгради, къщи и параклис, всички в употреба
      en: buildings, houses and a chapel, all still in use
      de: Gebäude, Häuser und eine Kapelle, alle in Nutzung
    unconfirmed: false
  - value: "1"
    label:
      bg: семейство, две поколения на обекта
      en: family, two generations on site
      de: Familie, zwei Generationen auf der Baustelle
    unconfirmed: true
crews:
  - key: site
    scene: site
    title:
      bg: Екипът на обекта
      en: The crew on site
      de: Das Team auf der Baustelle
    body:
      bg: От основите до последния слой боя. Обикновено ги намирате на скелето.
      en: From the foundations to the last coat of paint. Usually found on the scaffolding.
      de: Vom Fundament bis zum letzten Anstrich. Meist auf dem Gerüst zu finden.
    roles:
      - tool: plumb
        role:
          bg: Бригадир
          en: Foreman
          de: Vorarbeiter
        years: 22
        quip:
          bg: Помолихме го да позира. Провери отвеса вместо това.
          en: Asked to pose. Checked the plumb line instead.
          de: Sollte posieren. Prüfte stattdessen das Lot.
      - tool: trowel
        role:
          bg: Мазач
          en: Plasterer
          de: Stuckateur
        years: 15
        quip:
          bg: Ще се усмихне, като изсъхне мазилката.
          en: Will smile once the plaster dries.
          de: Lächelt, sobald der Putz trocken ist.
      - tool: boards
        role:
          bg: Топлоизолации
          en: Insulation
          de: Dämmung
        years: 11
        quip:
          bg: Предпочита да го снимаме с термокамера.
          en: Prefers to be photographed in thermal imaging.
          de: Lässt sich lieber per Wärmebild fotografieren.
      - tool: roller
        role:
          bg: Бояджия
          en: Painter
          de: Maler
        years: 18
        quip:
          bg: Казва, че стената е портретът.
          en: Says the wall is the portrait.
          de: Sagt, die Wand sei das Porträt.
      - tool: tiles
        role:
          bg: Плочкаджия
          en: Tiler
          de: Fliesenleger
        years: 14
        quip:
          bg: Записахме го за снимки. Нареди 40 м² плочки вместо това.
          en: Booked for the shoot. Laid 40 m² of tile instead.
          de: Zum Shooting gebucht. Verlegte stattdessen 40 m² Fliesen.
      - tool: spatula
        role:
          bg: Декоративни покрития
          en: Decorative finishes
          de: Dekorputz
        years: 12
        quip:
          bg: Венецианската мазилка иска седем слоя. Тя също.
          en: Venetian plaster takes seven coats. So does she.
          de: Venezianischer Putz braucht sieben Schichten. Sie auch.
      - tool: hat
        role:
          bg: Технически ръководител
          en: Site manager
          de: Bauleiter
        years: 25
        quip:
          bg: Отложи снимката заради бетониране.
          en: Rescheduled the photo for a concrete pour.
          de: Fototermin wegen Betonage verschoben.
      - tool: brick
        role:
          bg: Зидар
          en: Mason
          de: Maurer
        years: 20
        quip:
          bg: Наредил е повече тухли, отколкото селфита е направил.
          en: Has laid more bricks than he has taken selfies.
          de: Mehr Ziegel gesetzt als Selfies gemacht.
      - tool: truss
        role:
          bg: Дърводелец, покриви
          en: Carpenter, roofs
          de: Zimmermann, Dächer
        years: 13
        quip:
          bg: Мери два пъти. Още не е готов за близък план.
          en: Measured twice. Still not ready for his close-up.
          de: Zweimal gemessen. Noch nicht bereit fürs Close-up.
  - key: office
    scene: office
    title:
      bg: Екипът в офиса
      en: The crew in the office
      de: Das Team im Büro
    body:
      bg: Оферти, проекти, поръчки, документи и телефонът, който отговаря. Обикновено ги намирате зад купчина чертежи.
      en: Quotes, drawings, orders, paperwork and the phone that answers. Usually found behind a stack of drawings.
      de: Angebote, Pläne, Bestellungen, Papierkram und das Telefon, das abhebt. Meist hinter einem Stapel Pläne zu finden.
    roles:
      - tool: key
        role:
          bg: Управител
          en: Managing director
          de: Geschäftsführer
        years: 30
        quip:
          bg: Подписва всеки протокол за предаване. Снимката още не я е одобрил.
          en: Signs off every handover. Has not signed off on this photo yet.
          de: Zeichnet jede Übergabe ab. Dieses Foto noch nicht.
      - tool: ledger
        role:
          bg: Счетоводител
          en: Accountant
          de: Buchhalter
        years: 19
        quip:
          bg: Изчисли фотосесията до последния цент. Ще се появи, щом бъде фактурирана.
          en: Priced the photo shoot to the last cent. Will appear once it is invoiced.
          de: Hat das Shooting auf den Cent kalkuliert. Erscheint, sobald es fakturiert ist.
      - tool: square
        role:
          bg: Проектант
          en: Design engineer
          de: Planer
        years: 16
        quip:
          bg: Начерта общата снимка в мащаб. Забрави да се включи в нея.
          en: Drew the group photo to scale. Forgot to draw himself in.
          de: Hat das Gruppenfoto maßstabsgetreu gezeichnet. Sich selbst vergessen.
      - tool: laptop
        role:
          bg: IT
          en: IT
          de: IT
        years: 6
        quip:
          bg: Казва, че снимката е в облака. Облака никой не го е виждал.
          en: Says the photo is in the cloud. Nobody has seen the cloud.
          de: Sagt, das Foto sei in der Cloud. Niemand hat die Cloud gesehen.
partner_services:
  - icon: blueprint
    title:
      bg: Проверка на изпълнимостта
      en: Constructability review
      de: Prüfung der Ausführbarkeit
    body:
      bg: Проверка на проекта преди строежа, за да излязат проблемите на хартия, а не на обекта.
      en: Your drawings checked before anything is built, so problems show up on paper, not on site.
      de: Ihre Pläne vor Baubeginn geprüft, damit Probleme auf dem Papier auftauchen, nicht auf der Baustelle.
  - icon: square
    title:
      bg: Архитектура и интериорен дизайн
      en: Architecture & interior design
      de: Architektur & Innenarchitektur
    body:
      bg: От първата скица до работния проект и спецификацията на материалите.
      en: From the first sketch to working drawings and the material schedule.
      de: Von der ersten Skizze bis zu Ausführungsplänen und Materialliste.
  - icon: beam
    title:
      bg: Конструктивно проектиране
      en: Structural engineering
      de: Tragwerksplanung
    body:
      bg: Изчисления и конструктивни чертежи, включително за стари сгради.
      en: Calculations and structural drawings, including for old buildings.
      de: Statik und Tragwerkspläne, auch für Bestandsgebäude.
  - icon: permit
    title:
      bg: Разрешения и строителен надзор
      en: Permits & site supervision
      de: Genehmigungen & Bauüberwachung
    body:
      bg: Документите от разрешението за строеж до Акт 16.
      en: The paperwork from building permit to Act 16, handled.
      de: Die Unterlagen von der Baugenehmigung bis zur Abnahme (Akt 16).
  - icon: survey
    title:
      bg: Геодезия
      en: Surveying
      de: Vermessung
    body:
      bg: Трасиране и нива, измерени преди да копаем.
      en: Plots, levels and setting out, measured before we dig.
      de: Grundstück, Höhen und Absteckung, vermessen vor dem Aushub.
  - icon: bolt
    title:
      bg: Електроинсталации
      en: Electrical
      de: Elektroinstallation
    body:
      bg: Окабеляване, табла и осветление, преди да положим мазилката.
      en: Wiring, panels and lighting, laid before our plaster goes on.
      de: Leitungen, Verteiler und Licht, verlegt bevor unser Putz kommt.
  - icon: drop
    title:
      bg: ВиК и отопление
      en: Plumbing & heating
      de: Sanitär & Heizung
    body:
      bg: Водопровод, канализация, подово отопление и газ.
      en: Water, drainage, underfloor heating and gas.
      de: Wasser, Abwasser, Fußbodenheizung und Gas.
  - icon: air
    title:
      bg: Климатизация и вентилация
      en: Air conditioning & ventilation
      de: Klima & Lüftung
    body:
      bg: Системи, оразмерени за къщата, а не по каталог.
      en: Systems sized for the house, not the catalogue.
      de: Anlagen für das Haus ausgelegt, nicht für den Katalog.
  - icon: window
    title:
      bg: Дограма и врати
      en: Windows & doors
      de: Fenster & Türen
    body:
      bg: Профили и стъклопакети, вградени в изолацията ни без топлинни мостове.
      en: Profiles and glazing fitted into our insulation without thermal bridges.
      de: Profile und Verglasung, wärmebrückenfrei in unsere Dämmung eingebaut.
  - icon: kitchen
    title:
      bg: Кухни и мебели
      en: Kitchens & furniture
      de: Küchen & Möbel
    body:
      bg: По мярка, след като стените са прави и подовете нивелирани.
      en: Made to measure, after our walls are true and our floors are level.
      de: Nach Maß, wenn unsere Wände gerade und Böden eben sind.
  - icon: leaf
    title:
      bg: Енергиен одит и сертификат
      en: Energy audit & certificate
      de: Energieaudit & Ausweis
    body:
      bg: Одитът и сертификатът, за които е изпълнена изолацията.
      en: The audit and certificate your insulation was built to pass.
      de: Audit und Ausweis, für die Ihre Dämmung gebaut wurde.
  - icon: solar
    title:
      bg: Фотоволтаици
      en: Solar panels
      de: Photovoltaik
    body:
      bg: Покривни системи, планирани заедно с покрива, а не след него.
      en: Roof-mounted systems, planned with the roof rather than after it.
      de: Dachanlagen, mit dem Dach geplant statt nachträglich.
  - icon: tree
    title:
      bg: Озеленяване
      en: Landscaping
      de: Gartengestaltung
    body:
      bg: Градини, настилки и тераси, за да е завършен и дворът.
      en: Gardens, paving and terraces to finish the plot.
      de: Gärten, Wege und Terrassen für das ganze Grundstück.
