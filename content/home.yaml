rail_panels:
  - kind: capability
    after_project_index: 0
    accent: true
    label:
      bg: Собствен екип
      en: Our own crew
      de: Eigenes Team
    title:
      bg: Фасади
      en: Facades
      de: Fassaden
    body:
      bg: Топлоизолации, декоративни мазилки и каменни облицовки. Фасадният ни екип ги полага по системата на производителя, за да важи гаранцията.
      en: Thermal insulation, decorative plaster and stone cladding. Our facade crew lays them to the manufacturer's system, so the warranty holds.
      de: Wärmedämmung, Dekorputz und Steinverkleidungen. Unser Fassadenteam verlegt sie nach dem System des Herstellers, damit die Garantie gilt.
  - kind: capability
    after_project_index: 1
    accent: false
    label:
      bg: Същият екип и отвътре
      en: The same crew inside
      de: Dasselbe Team auch innen
    title:
      bg: Интериори и бояджийски работи
      en: Interiors & painting
      de: Innenausbau & Malerarbeiten
    body:
      bg: Шпаклоем, боядисваме, редим плочки и камък. Първата и последната стая ги довършват едни и същи хора.
      en: We fill and paint walls and lay tile and stone. The same people finish the first room and the last.
      de: Wir spachteln, streichen und verlegen Fliesen und Stein. Den ersten und den letzten Raum stellen dieselben Leute fertig.
  - kind: capability
    after_project_index: 2
    accent: false
    label:
      bg: Собствен екип
      en: Our own crew
      de: Eigenes Team
    title:
      bg: Нови сгради
      en: New buildings
      de: Neubauten
    body:
      bg: Наливаме основите и конструкцията, зидаме стените, покриваме сградата. Отговаряме за нея от първия бетон до предаването на ключа.
      en: We pour the foundations and the structure, build the walls and put on the roof. The building is our responsibility from the first concrete to the handover of the keys.
      de: Wir gießen Fundament und Tragwerk, mauern die Wände und decken das Dach. Vom ersten Beton bis zur Schlüsselübergabe tragen wir die Verantwortung.
  - kind: crew_stat
    after_project_index: 3
    stat_value: "{years}"
    unit:
      bg: години по обектите
      en: years on site
      de: Jahre auf der Baustelle
    body:
      bg: Семейна фирма от Стара Загора. Хората, които започват проекта Ви, го и завършват.
      en: A family company from Stara Zagora. The people who start your project also finish it.
      de: Ein Familienunternehmen aus Stara Sagora. Die Leute, die Ihr Projekt beginnen, stellen es auch fertig.
    unconfirmed: false
  - kind: capability
    after_project_index: 4
    accent: false
    label:
      bg: Партньори
      en: Partners
      de: Partner
    title:
      bg: Специалисти за останалото
      en: Specialists for the rest
      de: Spezialisten für den Rest
    body:
      bg: Дограма, кухни, инсталации, озеленяване. Възлагаме ги на партньори и координираме работата им на обекта Ви.
      en: Windows and doors, kitchens, installations, landscaping. We give this work to partners and coordinate it on your site.
      de: Fenster und Türen, Küchen, Installationen, Gartengestaltung. Wir vergeben diese Arbeiten an Partner und koordinieren sie auf Ihrer Baustelle.
  - kind: capability
    after_project_index: 8
    accent: false
    label:
      bg: Какво правим
      en: What we do
      de: Was wir tun
    title:
      bg: Реставрация
      en: Restoration
      de: Restaurierung
    body:
      bg: Родовата къща в Чепеларе, „Зелената баня“ от 1929 г., параклис с тухлен купол. Възстановяваме фасади, прозорци и зидария по запазени образци и снимки.
      en: The family house in Chepelare, the 1929 Green Bath, a chapel with a brick dome. We restore facades, windows and masonry from surviving originals and photographs.
      de: Das Familienhaus in Tschepelare, das „Grüne Bad“ von 1929, eine Kapelle mit Ziegelkuppel. Wir stellen Fassaden, Fenster und Mauerwerk nach erhaltenen Vorlagen und Fotos wieder her.
  - kind: crew_stat
    after_project_index: 9
    stat_value: "1"
    unit:
      bg: екип от основите до ключа
      en: crew, from the foundations to the keys
      de: Team, vom Fundament bis zum Schlüssel
    body:
      bg: Конструкцията, фасадите и довършителните работи изпълняват наши хора. Партньори включваме само там, където специалист се справя по-добре.
      en: Our own people build the structure, the facades and the finishing work. We bring in partners only where a specialist does the job better.
      de: Rohbau, Fassaden und Ausbau führen unsere eigenen Leute aus. Partner holen wir nur dort dazu, wo ein Spezialist die Arbeit besser macht.
    unconfirmed: false
  - kind: capability
    after_project_index: 11
    accent: false
    label:
      bg: Как работим
      en: How we work
      de: Wie wir arbeiten
    title:
      bg: Виждате обекта си всеки ден
      en: You see your site every day
      de: Sie sehen Ihre Baustelle jeden Tag
    body:
      bg: Всеки ден качваме в общ дневник снимки, протоколи и списъци на вложените материали. При предаването знаете какво е вградено във всеки слой.
      en: Every day we upload photos, protocols and lists of the materials used to a shared site log. At handover you know what went into every layer.
      de: Jeden Tag laden wir Fotos, Protokolle und Listen der verbauten Materialien in ein gemeinsames Bautagebuch. Bei der Übergabe wissen Sie, was in jeder Schicht verbaut ist.
  - kind: invite
    after_project_index: 6
    label:
      bg: Следващият обект
      en: The next site
      de: Die nächste Baustelle
    lead:
      bg: Тук може да е
      en: This could be
      de: Hier entsteht vielleicht
    turns:
      - bg: Вашата къща
        en: your house
        de: Ihr Haus
      - bg: Вашата жилищна сграда
        en: your apartment building
        de: Ihr Wohnhaus
      - bg: Вашият офис
        en: your office
        de: Ihr Büro
    body:
      bg: Разкажете ни какво искате да построите или обновите. Идваме на оглед.
      en: Tell us what you want to build or renovate. We come for a site visit.
      de: Erzählen Sie uns, was Sie bauen oder renovieren möchten. Wir kommen zu einem Vor-Ort-Termin.
  - kind: invite
    after_project_index: 99
    label:
      bg: Свободно място
      en: An open slot
      de: Ein freier Platz
    lead:
      bg: Тук може да е
      en: This could be
      de: Hier entsteht vielleicht
    turns:
      - bg: Вашата къща
        en: your house
        de: Ihr Haus
      - bg: Вашият хотел
        en: your hotel
        de: Ihr Hotel
      - bg: Вашата фасада
        en: your facade
        de: Ihre Fassade
    body:
      bg: Разкажете ни какво искате да построите или обновите. Идваме на оглед.
      en: Tell us what you want to build or renovate. We come for a site visit.
      de: Erzählen Sie uns, was Sie bauen oder renovieren möchten. Wir kommen zu einem Vor-Ort-Termin.
promises:
  - title:
      bg: Оглед преди началото
      en: A site visit before we start
      de: Vor-Ort-Termin vor Baubeginn
    body:
      bg: Идваме на обекта, преглеждаме проекта и описваме всеки етап, преди да започнем.
      en: We come to the site, go through the design and describe every stage before we start.
      de: Wir kommen auf die Baustelle, gehen das Projekt durch und beschreiben jede Etappe, bevor wir beginnen.
  - title:
      bg: По системата на производителя
      en: To the manufacturer's system
      de: Nach dem System des Herstellers
    body:
      bg: Полагаме всеки слой по системата на производителя и българските норми. Знаете кой материал е вграден и къде.
      en: We lay every layer to the manufacturer's system and Bulgarian standards. You know which material went in and where.
      de: Wir bauen jede Schicht nach dem System des Herstellers und den bulgarischen Normen auf. Sie wissen, welches Material wo verbaut ist.
  - title:
      bg: Снимки на всеки скрит слой
      en: A photo of every hidden layer
      de: Fotos von jeder verdeckten Schicht
    body:
      bg: "Снимаме и протоколираме всичко, което после покриваме: изолации, хидроизолации, инсталации."
      en: "We photograph and record in protocols everything we later cover: insulation, waterproofing, installations."
      de: "Wir fotografieren und protokollieren alles, was wir später verdecken: Dämmung, Abdichtung, Installationen."
  - title:
      bg: Предаване стая по стая
      en: Handover room by room
      de: Übergabe Raum für Raum
    body:
      bg: Приемате обекта стая по стая. Документите и гаранциите получавате на едно място.
      en: You accept the building room by room. You get the documents and warranties in one place.
      de: Sie nehmen das Objekt Raum für Raum ab. Unterlagen und Garantien erhalten Sie an einem Ort.
stats:
  - value: "{years}"
    label:
      bg: години строим в Стара Загора
      en: years building in Stara Zagora
      de: Jahre Bauen in Stara Sagora
    unconfirmed: false
  - value: 24000
    label:
      bg: м² разгъната площ в проектите на тази страница
      en: m² gross floor area in the projects on this page
      de: m² Bruttogeschossfläche in den Projekten auf dieser Seite
    unconfirmed: false
  - value: 17
    label:
      bg: сгради, къщи и параклис, които се ползват и днес
      en: buildings, houses and a chapel, still in use today
      de: Gebäude, Häuser und eine Kapelle, die heute noch genutzt werden
    unconfirmed: false
  - value: 1
    label:
      bg: семейство, две поколения на строежа
      en: family, two generations on site
      de: Familie, zwei Generationen auf der Baustelle
    unconfirmed: true
crews:
  - key: site
    scene: site
    title:
      bg: Екипът на обекта
      en: The crew on site
      de: Das Team auf der Baustelle
    body:
      bg: От основите до последния слой боя. Обикновено са на скелето.
      en: From the foundations to the last coat of paint. Usually on the scaffolding.
      de: Vom Fundament bis zum letzten Anstrich. Meist auf dem Gerüst.
    roles:
      - tool: plumb
        role:
          bg: Бригадир
          en: Foreman
          de: Vorarbeiter
        years: 22
        quip:
          bg: Разпределя хората на обекта и проверява отвеса.
          en: Assigns the people on site and checks the plumb line.
          de: Teilt die Leute auf der Baustelle ein und prüft das Lot.
      - tool: trowel
        role:
          bg: Мазач
          en: Plasterer
          de: Verputzer
        years: 15
        quip:
          bg: Маже стените и таваните.
          en: Plasters the walls and ceilings.
          de: Verputzt Wände und Decken.
      - tool: boards
        role:
          bg: Изолировчик
          en: Insulation fitter
          de: Dämmmonteur
        years: 11
        quip:
          bg: Лепи топлоизолацията по фасадите.
          en: Fixes the thermal insulation to the facades.
          de: Klebt die Wärmedämmung an die Fassaden.
      - tool: roller
        role:
          bg: Бояджия
          en: Painter
          de: Maler
        years: 18
        quip:
          bg: Шпаклова и боядисва стените.
          en: Fills and paints the walls.
          de: Spachtelt und streicht die Wände.
      - tool: tiles
        role:
          bg: Плочкаджия
          en: Tiler
          de: Fliesenleger
        years: 14
        quip:
          bg: Реди плочки и камък по подове, бани и тераси.
          en: Lays tile and stone on floors, in bathrooms and on terraces.
          de: Verlegt Fliesen und Stein auf Böden, in Bädern und auf Terrassen.
      - tool: spatula
        role:
          bg: Декоративни покрития
          en: Decorative finishes
          de: Dekorative Beschichtungen
        years: 12
        quip:
          bg: Полага декоративни и венециански мазилки.
          en: Applies decorative and Venetian plaster.
          de: Trägt Dekorputz und venezianischen Putz auf.
      - tool: hat
        role:
          bg: Технически ръководител
          en: Site manager
          de: Bauleiter
        years: 25
        quip:
          bg: Води строежа по проекта и съставя протоколите за всеки етап.
          en: Runs the build to the design and draws up the protocols for every stage.
          de: Führt den Bau nach dem Projekt und erstellt die Protokolle für jede Etappe.
      - tool: brick
        role:
          bg: Зидар
          en: Mason
          de: Maurer
        years: 20
        quip:
          bg: Зида стени от тухли и блокове.
          en: Builds walls in brick and block.
          de: Mauert Wände aus Ziegeln und Blocksteinen.
      - tool: truss
        role:
          bg: Дърводелец, покриви
          en: Carpenter, roofs
          de: Zimmermann, Dächer
        years: 13
        quip:
          bg: Прави дървените конструкции на покривите.
          en: Builds the timber roof structures.
          de: Baut die Holzkonstruktionen der Dächer.
  - key: office
    scene: office
    title:
      bg: Екипът в офиса
      en: The crew in the office
      de: Das Team im Büro
    body:
      bg: Проекти, поръчки на материали, документи и телефонът, на който Ви отговаряме.
      en: Designs, material orders, documents and the phone we answer when you call.
      de: Projekte, Materialbestellungen, Unterlagen und das Telefon, an dem wir Ihnen antworten.
    roles:
      - tool: key
        role:
          bg: Управител
          en: Managing director
          de: Geschäftsführer
        years: 30
        quip:
          bg: Ръководи фирмата и подписва всеки протокол за предаване.
          en: Runs the company and signs every handover protocol.
          de: Leitet die Firma und unterschreibt jedes Übergabeprotokoll.
      - tool: ledger
        role:
          bg: Счетоводител
          en: Accountant
          de: Buchhalter
        years: 19
        quip:
          bg: Води счетоводството и документите на фирмата.
          en: Keeps the company's accounts and documents.
          de: Führt die Buchhaltung und die Unterlagen der Firma.
      - tool: square
        role:
          bg: Проектант
          en: Design engineer
          de: Planer
        years: 16
        quip:
          bg: Чертае и проверява проектите, преди да започне строежът.
          en: Draws and checks the designs before construction starts.
          de: Zeichnet und prüft die Pläne, bevor der Bau beginnt.
      - tool: laptop
        role:
          bg: IT
          en: IT
          de: IT
        years: 6
        quip:
          bg: Поддържа компютрите, сайта и дневника на обектите.
          en: Looks after the computers, the website and the site log.
          de: Betreut die Computer, die Website und das Bautagebuch.
partner_services:
  - icon: blueprint
    title:
      bg: Проверка на изпълнимостта
      en: Constructability review
      de: Prüfung der Ausführbarkeit
    body:
      bg: Преглеждаме проекта преди строежа. Проблемите излизат на хартия, преди да стигнат до обекта.
      en: We review the design before construction. Problems show up on paper before they reach the site.
      de: Wir prüfen das Projekt vor dem Bau. Probleme zeigen sich auf dem Papier, bevor sie die Baustelle erreichen.
  - icon: square
    title:
      bg: Архитектура и интериорен дизайн
      en: Architecture & interior design
      de: Architektur & Innenarchitektur
    body:
      bg: От първата скица до работния проект и спецификацията на материалите.
      en: From the first sketch to the working design and the material specification.
      de: Von der ersten Skizze bis zum Ausführungsprojekt und zur Materialspezifikation.
  - icon: beam
    title:
      bg: Конструктивно проектиране
      en: Structural engineering
      de: Tragwerksplanung
    body:
      bg: Изчисления и конструктивни чертежи, включително за стари сгради.
      en: Calculations and structural drawings, including for old buildings.
      de: Berechnungen und Tragwerkspläne, auch für alte Gebäude.
  - icon: permit
    title:
      bg: Разрешения и строителен надзор
      en: Permits & site supervision
      de: Genehmigungen & Bauüberwachung
    body:
      bg: Документите от разрешението за строеж до Акт 16.
      en: The documents from the building permit to Act 16.
      de: Die Unterlagen von der Baugenehmigung bis zum Akt 16.
  - icon: survey
    title:
      bg: Геодезия
      en: Surveying
      de: Vermessung
    body:
      bg: Трасиране и нивелация преди изкопа.
      en: Setting out and levelling before excavation.
      de: Absteckung und Nivellement vor dem Aushub.
  - icon: bolt
    title:
      bg: Електроинсталации
      en: Electrical
      de: Elektroinstallation
    body:
      bg: Кабели, табла и осветление, положени преди мазилката.
      en: Cables, panels and lighting, laid before the plaster.
      de: Kabel, Verteiler und Beleuchtung, verlegt vor dem Putz.
  - icon: drop
    title:
      bg: ВиК и отопление
      en: Plumbing & heating
      de: Sanitär & Heizung
    body:
      bg: Водопровод, канализация, подово отопление и газ.
      en: Water supply, drainage, underfloor heating and gas.
      de: Wasserleitung, Abwasser, Fußbodenheizung und Gas.
  - icon: air
    title:
      bg: Климатизация и вентилация
      en: Air conditioning & ventilation
      de: Klima & Lüftung
    body:
      bg: Системи, оразмерени за конкретната сграда.
      en: Systems sized for the building in question.
      de: Anlagen, ausgelegt für das jeweilige Gebäude.
  - icon: window
    title:
      bg: Дограма и врати
      en: Windows & doors
      de: Fenster & Türen
    body:
      bg: Профили и стъклопакети, вградени в изолацията без топлинни мостове.
      en: Profiles and glazing units, fitted into the insulation without thermal bridges.
      de: Profile und Isolierglas, ohne Wärmebrücken in die Dämmung eingebaut.
  - icon: kitchen
    title:
      bg: Кухни и мебели
      en: Kitchens & furniture
      de: Küchen & Möbel
    body:
      bg: По мярка, след като стените са изправени и подовете нивелирани.
      en: Made to measure, once the walls are straight and the floors level.
      de: Nach Maß, sobald die Wände gerade und die Böden nivelliert sind.
  - icon: leaf
    title:
      bg: Енергиен одит и сертификат
      en: Energy audit & certificate
      de: Energieaudit & Ausweis
    body:
      bg: Енергийно обследване и сертификат за сградата след изолацията.
      en: Energy survey and certificate for the building after the insulation.
      de: Energetische Untersuchung und Ausweis für das Gebäude nach der Dämmung.
  - icon: solar
    title:
      bg: Фотоволтаици
      en: Solar panels
      de: Photovoltaik
    body:
      bg: Покривни системи, планирани заедно с покрива.
      en: Roof systems, planned together with the roof.
      de: Dachanlagen, gemeinsam mit dem Dach geplant.
  - icon: tree
    title:
      bg: Озеленяване
      en: Landscaping
      de: Gartengestaltung
    body:
      bg: Градини, настилки и тераси, за да е завършен и дворът.
      en: Gardens, paving and terraces, so the yard is finished too.
      de: Gärten, Wege und Terrassen, damit auch der Hof fertig ist.
