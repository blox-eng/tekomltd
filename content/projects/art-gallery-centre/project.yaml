  en: Office and retail centre with art gallery
  de: Büro- und Geschäftshaus mit Kunstgalerie
summary:
  bg: Търговски и офис център на ъгъла на ул. „Хаджи Димитър Асенов“ и ул. „Генерал Столетов“, в археологическия резерват „Августа Траяна – Берое“. Сградата е със скелетна стоманобетонна конструкция, шест надземни етажа и сутерен, с пет магазина и 17 офиса. При изкопа бяха открити части от римските крепостни стени (II–VI век). Те са консервирани и показани в сутерена, където вместо паркинг е оформена художествена галерия.
