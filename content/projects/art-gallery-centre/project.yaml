  en: Six-storey office and retail building in the Augusta Traiana reserve. The Roman fortress walls found on site are preserved in a basement gallery.
  de: Sechsgeschossiges Büro- und Geschäftshaus im Reservat Augusta Traiana. Die beim Aushub gefundenen römischen Mauern sind im Untergeschoss zu sehen.
