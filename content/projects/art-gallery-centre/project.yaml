  en: Office and retail centre with art gallery
  de: Büro- und Geschäftshaus mit Kunstgalerie
summary:
  bg: Търговска и офис сграда на ъгъла на ул. „Хаджи Димитър Асенов“ и ул. „Генерал Столетов“, в археологическия резерват „Августа Траяна – Берое“. Тя има скелетна стоманобетонна конструкция, шест надземни етажа и сутерен. В нея са пет магазина и 17 офиса. При изкопа бяха открити части от римските крепостни стени от II–VI век. Стените са консервирани и показани в сутерена, където вместо паркинг е оформена художествена галерия.
