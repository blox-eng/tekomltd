summary:
  bg: Обектът се намира на територията на археологическия резерват „Августа Траяна – Берое“ в централната част на града, По време на строителния процес на ниво сутерен са открити археологически находки – части от крепостните стени на античния град, датирани от римската и ранновизантийската епоха – II – VI век. Архитектурната разработка е дело на арх. Стойко Илчев.
