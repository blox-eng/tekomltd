summary:
  bg: Тази седеметажна сграда на ул. „Х. Д. Асенов“ № 129-131 в Стара Загора е най-новият проект на ТЕКОМ ООД, изграден изцяло от основи — инвестиция на компанията, реализирана съвместно със съинвеститор. Сградата разполага с просторни гаражи в сутерена и на първия етаж, както и с няколко магазина за промишлени стоки. От втория до седмия етаж ще откриете светли апартаменти с обща разгъната площ от 2775 кв.м.
