title:
  bg: Жилищна сграда на ул. „Хаджи Димитър Асенов“ 129–131
  en: Apartment building, 129–131 Hadzhi Dimitar Asenov St
  de: Wohnhaus, ul. Hadzhi Dimitar Asenov 129–131
summary:
  bg: Седеметажна жилищна сграда със сутерен на ул. „Хаджи Димитър Асенов“ 129–131. ТЕКОМ беше съинвеститор и строител и построи сградата от основите. В нея има 25 апартамента и пет магазина. Гаражите са в сутерена и на партера. Конструкцията е монолитна, безгредова, от стоманобетон. Фасадата съчетава облицовка с дървесна структура и наномазилка. Дограмата е PVC с троен стъклопакет. Сградата е въведена в експлоатация през 2021 г.
