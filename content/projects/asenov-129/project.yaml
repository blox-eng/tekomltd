summary:
  bg: Седеметажна жилищна сграда със сутерен на ул. „Хаджи Димитър Асенов“ 129–131, изградена от ТЕКОМ от основите като собствена инвестиция със съинвеститор. Има 25 апартамента, 5 магазина и гаражи в сутерена и на партера. Конструкцията е монолитна безгредова стоманобетонна. Фасадата съчетава облицовка с дървесна структура и нано мазилка, а дограмата е PVC с троен стъклопакет. Въведена е в експлоатация през 2021 г.
