  en: Restored family house in Chepelare
  de: Wiederaufgebautes Familienhaus in Tschepelare
summary:
  bg: Реконструкция на родова къща на ул. „Дичо Петров“ 30 в Чепеларе и преустройството ѝ в къща за гости, завършени през 2004 г. Първата къща на рода е построена на това място през втората половина на XIX век, а сегашната е възстановена по стари снимки. Външните стени са от каменна зидария, подовете са на дървен гредоред, покривът е дървен с керемиди. Къщата има четири стаи и механа с камина.
