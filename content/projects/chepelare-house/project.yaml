summary:
  bg: Този проект в сърцето на планинския курортен град Чепеларе е луксозна реновация на автентична семейна къща, а не ново строителство. Старата постройка е издигната от кирпич — традиционен градивен материал за региона, който изисква специфичен и внимателен реставрационен подход заради чувствителността му към влага и нуждата от структурно укрепване. Къщата се намира на ул. „Дичо Петров”, в непосредствена близост до централната част на Чепеларе.
