  bg: Жилищна сграда на пет етажа с терасовиден етаж и подземни гаражи на ул. „Гладстон“ 41 в Стара Загора, построена през 2001–2003 г. Сградата има 12 жилища, три офиса и три магазина към улицата. В двора е медицински център със седем лекарски кабинета и самостоятелен вход. В сутерена са десет гаража и складове към жилищата и офисите.
