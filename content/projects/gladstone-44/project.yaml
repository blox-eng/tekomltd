  bg: Жилищна сграда на ул. „Гладстон“ 41 в Стара Загора, построена през 2001–2003 г. Има пет етажа, терасовиден етаж и подземни гаражи. В нея са 12 жилища, три офиса и три магазина към улицата. В двора е медицински център със седем лекарски кабинета и отделен вход. В сутерена са десет гаража и складове към жилищата и офисите.
