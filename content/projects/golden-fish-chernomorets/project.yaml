summary:
  bg: Ваканционен комплекс в северозападната част на Черноморец, на около 300 м от плажа. Сградата е с два входа, сутерен с гаражи и складове, три етажа и терасовиден етаж, с общо 50 апартамента, магазин и бистро. Конструкцията е монолитна стоманобетонна, фасадите са с мазилка и каменна облицовка на цокъла, покривът е дървен. Проект на арх. Николай Ситев, въведен в експлоатация през 2010 г.
