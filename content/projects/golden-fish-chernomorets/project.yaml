summary:
  bg: Ваканционен комплекс в северозападната част на Черноморец, на около 300 м от плажа. Сградата има два входа, сутерен с гаражи и складове, три етажа и терасовиден етаж. В нея са 50 апартамента, магазин и бистро. Конструкцията е монолитна стоманобетонна. Фасадите са с мазилка, цокълът е облицован с камък, покривът е дървен. Проектът е на арх. Николай Ситев. Комплексът е въведен в експлоатация през 2010 г.
