slug: green-bath-eye-clinic
title:
  bg: Очен медицински център в „Зелената баня“
  en: Eye clinic in the 1929 “Green Bath”
  de: Augenklinik im „Grünen Bad“ von 1929
summary:
  bg: Сградата, известна сред старозагорци като „Зелената баня“, е построена през 1929 г. и е един от емблематичните обекти от периода на междувоенния модернизъм. След години на неизползване и частично рушене, през 2023 г. е взето решение тя да бъде преустройна в съвременен очен медицински център, като се запазят нейният архитектурен дух и характерните декоративни елементи.
