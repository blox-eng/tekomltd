meta_description:
  bg: Паметник на културата от 1929 г., преустроен в очен медицински център. Консервация и реставрация на фасадите. „Сребърна фасада на годината“ 2025.
  en: A listed cultural monument from 1929, converted into an eye clinic. Conservation and restoration of the facades. Silver Facade of the Year 2025.
  de: Ein Kulturdenkmal von 1929, umgebaut zur Augenklinik. Konservierung und Restaurierung der Fassaden. „Silberne Fassade des Jahres“ 2025.
