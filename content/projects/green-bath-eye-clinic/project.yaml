slug: green-bath-eye-clinic
title:
  bg: Очен медицински център в „Зелената баня“
  en: Eye clinic in the 1929 “Green Bath”
  de: Augenklinik im „Grünen Bad“ von 1929
summary:
  bg: Сградата на „Зелената баня“ е открита през 1929 г. по проект на арх. Христо Димов и е паметник на културата с местно значение. През 2022–2025 г. ТЕКОМ я преустрои в очен медицински център с консервационно-реставрационни работи по фасадите, възстановени южни прозорци и фасадна система Баумит. Обектът получи „Сребърна фасада на годината“ 2025 и беше финалист в Baumit Life Challenge 2026.
