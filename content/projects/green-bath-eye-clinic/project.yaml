slug: green-bath-eye-clinic
title:
  bg: Преустройство на „Зелената баня“ в очен медицински център
  en: Conversion of the Green Bath into an eye clinic
  de: Umbau des „Grünen Bads“ zur Augenklinik
summary:
  bg: „Зелената баня“ е открита през 1929 г. по проект на арх. Христо Димов. Сградата е паметник на културата с местно значение. През 2022–2025 г. ТЕКОМ я преустрои в очен медицински център. Изпълни консервационно-реставрационни работи по фасадите, възстанови южните прозорци и положи фасадна система Баумит. Обектът получи „Сребърна фасада на годината“ 2025 и беше финалист в Baumit Life Challenge 2026.
