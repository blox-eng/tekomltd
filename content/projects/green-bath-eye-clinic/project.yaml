meta_description:
  bg: Паметник на културата от 1929 г., преустроен в очен медицински център с консервация и реставрация на фасадите. „Сребърна фасада на годината“ 2025.
  en: A listed 1929 bathhouse converted into an eye clinic, with its facades conserved and restored. Silver Facade of the Year 2025.
  de: Denkmalgeschütztes Bad von 1929, umgebaut zur Augenklinik, mit konservierten und restaurierten Fassaden. „Silberne Fassade des Jahres“ 2025.
