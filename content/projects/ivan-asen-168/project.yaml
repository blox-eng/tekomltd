  bg: Жилищна сграда на ул. „Цар Иван Асен II“ 168 в Стара Загора, с пет етажа и терасовиден етаж. На партера има магазини и лекарски кабинети, а в жилищната част има 10 апартамента с мазета. ТЕКОМ изпълни всички конструкции, зидарии, мазилки, топло- и хидроизолации и довършителни работи. Сградата е завършена през 2005 г.
