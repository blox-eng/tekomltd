  bg: Жилищна сграда на ул. „Цар Иван Асен II“ 168 в Стара Загора. Има пет етажа и терасовиден етаж. На партера са магазини и лекарски кабинети. В жилищната част са десет апартамента с мазета. Сградата има общ двор. ТЕКОМ изпълни всички конструкции, зидарии, мазилки, топло- и хидроизолации и довършителни работи и завърши сградата през 2005 г.
