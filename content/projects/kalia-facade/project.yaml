slug: kalia-facade
title:
  bg: Фасада на жилищна сграда „Калия“
  en: Facade of the Kalia apartment building
  de: Fassade des Wohnhauses „Kalia“
summary:
  bg: Фасада на нова многофамилна жилищна сграда с гаражи до парк „Аязмо“. ТЕКОМ положи топлоизолационна система с 10 см минерална вата и хидрофобна силикатна мазилка по около 1 700 м². Обрамчи прозорците и облицова около 50 м² с фиброцимент с дървесна структура. Вътре измаза стените и таваните с машинна мазилка. Терасите получиха хидроизолация и настилка от гранитогрес.
