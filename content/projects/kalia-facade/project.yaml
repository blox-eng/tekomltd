  en: Mineral wool insulation and silicate render over 1,700 m² of facade, wood-textured fibre cement cladding and porcelain-tiled terraces.
  de: Mineralwolldämmung und Silikatputz auf 1.700 m² Fassade, Faserzementverkleidung in Holzoptik und Terrassen mit Feinsteinzeug.
