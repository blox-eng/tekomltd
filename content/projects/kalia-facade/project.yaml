  en: Thermal insulation with 10 cm of mineral wool and silicate render over 1,700 m² of facade, wood-textured fibre cement cladding and porcelain-tiled terraces.
  de: Wärmedämmung mit 10 cm Mineralwolle und Silikatputz auf 1.700 m² Fassade, Faserzementverkleidung in Holzoptik und Terrassen mit Feinsteinzeug.
