slug: kalia-facade
title:
  bg: Модерна фасада на жилищна сграда „Калия“
  en: Modern facade for the Kalia apartment building
  de: Moderne Fassade für das Wohnhaus „Kalia“
summary:
  bg: Фасадата на нова многофамилна жилищна сграда с гаражи до парк „Аязмо“. Изпълнихме топлоизолационна система с 10 см минерална вата и хидрофобна силикатна мазилка по около 1700 м², обрамчени прозорци и около 50 м² облицовка от фиброцимент с дървесна структура. Вътре положихме машинна мазилка по стени и тавани, а терасите получиха хидроизолация и настилка от гранитогрес.
