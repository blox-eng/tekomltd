  en: Family house on a hillside
  de: Einfamilienhaus am Hang
summary:
  bg: Къщата е проектирана от арх.Радосвета Кирчева. Ситуирана е в северозападната част на дворното място с цел да се осигури максимален изглед към двора на югоизток и долината на р.Сазлийка. Изградена е на две нива за да се използва максимално наклонения терен. На първото ниво има дневна част, кухненски бокс, голяма веранда, санитарен възел, дрешник, перално и кабинет.
