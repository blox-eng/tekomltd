meta_description:
  bg: Къща на две нива на наклонен терен над долината на Сазлийка. Стени Porotherm, фасада от гнайс и врачански варовик, подпорна стена и тераса с декинг.
  en: A two-level house on sloping ground above the Sazliyka valley. Porotherm walls, a facade of gneiss and Vratsa limestone, a retaining wall and a decked terrace.
  de: Ein Haus auf zwei Ebenen am Hang über dem Tal der Sazliyka. Porotherm-Mauerwerk, Fassade aus Gneis und Vratsa-Kalkstein, Stützmauer und Terrasse mit Holzdeck.
