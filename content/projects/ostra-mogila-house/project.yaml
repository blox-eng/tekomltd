summary:
  bg: Еднофамилна къща с гараж в с. Остра могила, по проект на арх. Радосвета Кирчева. Тя стои на наклонен терен с изглед към долината на р. Сазлийка. Изградена е на две нива през 2014–2016 г. Стените са от керамични блокове Porotherm, покривът е с керемиди Bramac. Фасадите са облицовани с гнайс и врачански варовик, первазите са от гранит. Изпълнени са и подпорна стена, ограда, тераса с декинг и барбекю.
