meta_description:
  bg: Къща на две нива на наклонен терен над долината на Сазлийка. Стени Porotherm, фасада от гнайс и врачански варовик, подпорна стена и тераса с декинг.
  en: A two-level house on a slope above the Sazliyka valley. Porotherm walls, gneiss and Vratsa limestone facades, a retaining wall and a decked terrace.
  de: Haus auf zwei Ebenen am Hang über dem Tal der Sazliyka. Porotherm-Mauerwerk, Fassaden aus Gneis und Kalkstein, Stützmauer und Holzterrasse.
