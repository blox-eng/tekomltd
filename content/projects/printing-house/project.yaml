summary:
  bg: Административна сграда и печатница в промишлената зона на Стара Загора, ул. „Индустриална“, построена през 2002–2003 г. ТЕКОМ изпълни стоманобетонната конструкция, зидариите, инсталациите и довършителните работи. Фасадата е с наклонен плътен панел с кръгъл прозорец, изпълнен с кофраж с криволинейни очертания и видим бетон. На първото ниво е печатната зала, с отделни входове за материали и за клиенти.
