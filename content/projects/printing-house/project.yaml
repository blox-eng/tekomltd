summary:
  bg: Административна сграда и печатница в промишлената зона на Стара Загора, на ул. „Индустриална“. Построена е през 2002–2003 г. ТЕКОМ изпълни стоманобетонната конструкция, зидариите, инсталациите и довършителните работи. На фасадата има наклонен плътен панел с кръгъл прозорец. Панелът е от видим бетон, излят в кофраж с криволинейни очертания. На първото ниво е печатната зала, с отделни входове за материали и за клиенти.
