summary:
  bg: Преустройство на хотел в Равда, проектиран през 2004 г., в сграда с ваканционни апартаменти. Хотелските стаи са обединени в 22 студиа и двустайни апартаменти на четири етажа, а на партера са запазени бистро и кафе. Апартаментите са изцяло ремонтирани и завършени до ключ. Проектът за преустройството е одобрен през февруари 2012 г.
