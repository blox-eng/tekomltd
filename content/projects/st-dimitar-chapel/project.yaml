meta_description:
  bg: Православен параклис в двора на Бухчевата къща, построен по канона на църквата. Куполът е самоносещ, изцяло от плътни тухли, без стоманобетон.
  en: An Orthodox chapel in the courtyard of the Buhchev House, built to church canon. The dome is self-supporting, all solid brick, with no reinforced concrete.
  de: Orthodoxe Kapelle im Hof des Buhtschew-Hauses, nach kirchlichem Kanon gebaut. Die Kuppel ist selbsttragend, ganz aus Vollziegeln, ohne Stahlbeton.
