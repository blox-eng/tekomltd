  en: St Dimitar chapel, solid brick dome
  de: Kapelle St. Dimitar mit Ziegelkuppel
summary:
  bg: Параклисът носи името на Св.Димитър и е изпълнен по желание на собственика в двора на Бухчевата къща – емблематична сграда в Стара Загора. Спазени са всички изисквания на канона на Православната църква. Интересно решение има за купола на Параклиса, който е изпълнен изцяло от плътни кермични тухли със самоносеща конструкция, без да е използван стоманобетон – така както са били изпълнявани в миналото.
