  de: Kapelle St. Dimitar im Hof des Buhtschew-Hauses
summary:
  bg: Параклисът „Св. Димитър“ е построен по желание на собственика в двора на Бухчевата къща в Стара Загора. Спазени са изискванията на канона на Православната църква. Куполът е изцяло от плътни керамични тухли, със самоносеща конструкция, без стоманобетон. Така са зидали куполите в миналото.
