summary:
  bg: Жилищна сграда на ул. „Генерал Столетов“ 44 в Стара Загора. Има подземен етаж, пет етажа и терасовиден етаж. В нея са 13 апартамента, а на партера са пет гаража и три магазина. В сутерена са складовете към жилищата. Сградата е монолитна, със скелетно-гредова конструкция и зидария от керамични тухли. Изградена е през 2000–2001 г.
