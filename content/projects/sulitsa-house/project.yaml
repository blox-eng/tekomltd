summary:
  bg: Надстройка и цялостно довършване на еднофамилна вила в с. Сулица, изпълнени през 2002 г. Старият покрив е демонтиран, изграден е нов етаж от газобетон със стоманобетонни колони и греди и нова дървена покривна конструкция с бетонови керемиди. Сградата е топлоизолирана със система на Баумит, изпълнени са бани, стълбища, сауна и вътрешни довършителни работи.
