summary:
  bg: Надстройка и довършване на еднофамилна вила в с. Сулица, изпълнени през 2002 г. Старият покрив е демонтиран, а на негово място е надзидан нов етаж от газобетон със стоманобетонни колони и греди. Отгоре е изградена нова дървена покривна конструкция с бетонови керемиди. Сградата е топлоизолирана със система на Баумит. Изпълнени са бани, стълбища, сауна и вътрешни довършителни работи. В двора има басейн.
