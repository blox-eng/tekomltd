summary:
  bg: Къщата е проектирана от арх.Николай Ситев. Ситуирана е в северозападната част на дворното място с цел да се осигури максимален изглед към басейна и двора на югоизток. Изградена е на три нива за да се използва максимално наклонения терен. На първото ниво има дневна част, кухненски бокс, голяма веранда, санитарен възел и кабинет. На второто ниво има три спални и санитарен възел, а на полуподземно ниво е предвиден склад.
