  en: "17 flats, offices and garages in the Augusta Traiana reserve. A 2nd-century Roman temple found during the dig is preserved under a protective cover. 2006."
  de: "17 Wohnungen, Büros und Garagen im Reservat Augusta Traiana. Ein römischer Tempel aus dem 2. Jh. blieb unter einer Schutzabdeckung erhalten. 2006."
