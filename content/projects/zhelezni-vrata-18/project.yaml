  en: Apartment building above a Roman temple
  de: Wohnhaus über einem römischen Tempel
summary:
  bg: Жилищна сграда на ул. „Железни врата“ 18–20, в резервата „Августа Траяна“, завършена през 2006 г. В нея има 17 апартамента, седем офиса, медицински кабинети и осем подземни гаража. При спасителните разкопки през 2004 г. бяха открити римски храм от края на II век и раннохристиянска базилика с баптистерий. Храмът е иззидан от каменни блокове с железни скоби и е запазен под защитно покритие. Заради него част от гаражите бяха съкратени.
