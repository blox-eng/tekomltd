slug: zhelezni-vrata-18
title:
  bg: Жилищна сграда над римски храм
  en: Apartment building above a Roman temple
  de: Wohnhaus über einem römischen Tempel
summary:
  bg: Сградата се намира на територията на археологическия резерват Августа Траяна в гр.Стара Загора. В процеса на проектиране са извършени археологически проучвания, в резултат на които са разкрити останките от два храма. В североизточната част на парцела Храм, датиран от II-III век, определен от археолозите като Храм на култа към Богинята Рома, изграден от монолитни добре обработени мраморни блокове, споени с оловни скоби.
