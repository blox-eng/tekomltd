slug: zhelezni-vrata-18
title:
  bg: Жилищна сграда над римски храм
  en: Apartment building above a Roman temple
  de: Wohnhaus über einem römischen Tempel
summary:
  bg: Жилищна сграда със 17 апартамента, 7 офиса, медицински кабинети и 8 подземни гаража в археологическия резерват „Августа Траяна“, завършена през 2006 г. При спасителните разкопки през 2004 г. бяха открити монументален римски храм от края на II век, изграден от каменни блокове с железни скоби, и раннохристиянска базилика с баптистерий. Храмът е запазен под защитно покритие, а част от гаражите бяха съкратени заради него.
