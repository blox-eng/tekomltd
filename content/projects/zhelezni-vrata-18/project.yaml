meta_description:
  bg: 17 апартамента, офиси и гаражи в резервата „Августа Траяна“. Римски храм от II век, открит при разкопките, е запазен под защитно покритие. 2006 г.
  en: 17 flats, offices and garages in the Augusta Traiana reserve. A 2nd-century Roman temple found during the excavations is preserved under a protective cover. 2006.
  de: 17 Wohnungen, Büros und Garagen im Reservat „Augusta Traiana“. Ein römischer Tempel aus dem 2. Jahrhundert, bei den Ausgrabungen entdeckt, ist unter einer Schutzabdeckung erhalten. 2006.
