summary:
  bg: Жилищна сграда на ул. „Железни врата“ 9 в Стара Загора, с пет етажа и терасовиден етаж. На партера са четири гаража. В жилищната част са девет апартамента с мазета. ТЕКОМ беше съинвеститор и строител. Изпълни конструкцията, зидариите, мазилките, топло- и хидроизолациите и фасадата с мазилка Баумит Нанопор. Строежът започна след спасителни археологически проучвания на терена и продължи от 2009 до 2011 г.
