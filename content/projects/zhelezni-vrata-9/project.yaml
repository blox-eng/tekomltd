summary:
  bg: Жилищна сграда на ул. „Железни врата“ 9 в Стара Загора, с пет етажа и терасовиден етаж. На партера има четири гаража, а в жилищната част са девет апартамента с мазета. ТЕКОМ беше съинвеститор и строител и изпълни конструкцията, зидариите, мазилките, топло- и хидроизолациите и фасадата с мазилка Баумит Нанопор. Строежът е от 2009 до 2011 г., след спасителни археологически проучвания на терена.
