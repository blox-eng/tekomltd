summary:
  bg: Плажен комплекс с открит басейн в кв. „Железник“, Стара Загора, изграден през 2001 г. Басейнът е с криволинейно очертание, преливник и бар във водата, с монолитни стоманобетонни дъно и стени и подводно осветление. В комплекса са изградени още компенсаторен резервоар и помпено помещение, сезонен бар, съблекални, душове, лекарски кабинет и офис. Настилките около басейна са от базалтови плочи.
