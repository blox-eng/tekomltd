summary:
  bg: Басейнът е с обем 500 м3 и е проектиран по всички изисквания за съвременно строителство на обществени съоръжения с възможност свободно да поеме около 300 посетители. Дълбочината е от 1.20 до 1.60 м. Разполага със съвременна инсталация за дезинфекция, филтриране и пречистване на водата. Конструкцията е монолитна, изградена е от водоплътен монолитен бетон.
