summary:
  bg: Плажен комплекс с открит басейн в кв. „Железник“, Стара Загора, изграден през 2001 г. Басейнът е с обем 500 м³, с криволинейно очертание, преливник, бар във водата и подводно осветление. Дъното и стените са излети монолитно от стоманобетон. В комплекса са изградени още компенсаторен резервоар, помпено помещение, сезонен бар, съблекални, душове, лекарски кабинет и офис. Около басейна е положена настилка от базалтови плочи.
