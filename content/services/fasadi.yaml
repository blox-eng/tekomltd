name:
  bg: Фасади и топлоизолация
nav_blurb:
  bg: Топлоизолационни системи, фасадни мазилки и облицовки
meta_title:
  bg: Фасади и топлоизолация в Стара Загора
meta_description:
  bg: Саниране, топлоизолация и фасадни мазилки на нови и стари сгради в Стара Загора. Всеки слой по системата на
    производителя. Строим от 1993 г.
h1:
  bg: Фасади и топлоизолация в Стара Загора
intro:
  bg: 'Полагаме топлоизолация, фасадни мазилки и облицовки на нови сгради и при саниране на стари. Работим
    със собствен екип, по системата на производителя. През 2021 г. изпълнихме фасадата на жилищна сграда „Калия“
    до парк „Аязмо“: около 1 700 м² с 10 см минерална вата и силикатна мазилка.'
benefits:
  - title:
      bg: 1 700 м² минерална вата на „Калия“
    body:
      bg: На ул. „Х. Д. Асенов“ 118–120 положихме 10 см минерална вата с хидрофобна силикатна мазилка и обрамчихме
        прозорците.
  - title:
      bg: Облицовка с дървесна структура
    body:
      bg: На „Калия“ положихме около 50 м² фиброцимент с дървесна структура. На собствената си сграда на ул. „Хаджи
        Димитър Асенов“ 129–131 съчетахме такава облицовка с наномазилка.
  - title:
      bg: „Сребърна фасада на годината“ 2025
    body:
      bg: Наградата получи „Зелената баня“, паметник на културата от 1929 г. На нея положихме фасадна система
        Баумит.
explainers:
  - title:
      bg: Саниране и топлоизолационни системи (ETICS)
    body:
      bg: 'Санирането обновява сградата отвън: изолация, армировка и нова мазилка, положени като една система. Нарича
        се ETICS (външна топлоизолационна композитна система). Тя работи, когато всички слоеве са от
        един производител и са положени по неговите указания. Тогава важат и гаранцията, и изчисленият ефект за
        енергийния клас на сградата.'
  - title:
      bg: Каменна вата или EPS
    body:
      bg: Каменната (минерална) вата е негорима и пропуска водните пари. Затова я полагаме на по-високи сгради и на
        стени, които трябва да „дишат“. EPS (експандиран полистирол) е по-лек и подходящ за повечето жилищни сгради.
        Цокъла, който е в досег с влагата, изолираме с XPS. Дебелината определя проектът или енергийният одит.
  - title:
      bg: Видове фасадни мазилки
    body:
      bg: Силикатната мазилка пропуска водните пари и е устойчива на мухъл. Силиконовата отблъсква водата и се замърсява
        по-бавно. Минералната е най-близка до традиционните мазилки и обикновено се боядисва. Избираме мазилката според
        сградата, изложението и вида, който искате.
steps_title:
  bg: Как изпълняваме фасадата
steps:
  - title:
      bg: Оглед и избор на система
    body:
      bg: Оглеждаме сградата, основата и детайлите около прозорците и терасите. После предлагаме система, дебелина
        на изолацията и финишен слой.
  - title:
      bg: Скеле и подготовка на основата
    body:
      bg: Вдигаме скеле по цялата фасада, за да работим безопасно и да полагаме всеки слой равномерно. После почистваме,
        изравняваме и грундираме стените, за да залепне изолацията без кухини.
  - title:
      bg: Топлоизолация
    body:
      bg: Лепим и дюбелираме топлоизолационните плочи. На жилищната сграда „Калия“ положихме 10 см минерална вата
        върху около 1 700 м² фасада.
  - title:
      bg: Армировка и обрамчване
    body:
      bg: Полагаме шпакловъчен слой с мрежа по цялата фасада и обрамчваме прозорците. Така ъглите и ръбовете остават
        здрави.
  - title:
      bg: Финишна мазилка или облицовка
    body:
      bg: Полагаме хидрофобна силикатна мазилка, Баумит Нанопор или облицовка, например фиброцимент с дървесна
        структура.
  - title:
      bg: Довършване и предаване
    body:
      bg: Довършваме детайлите около прозорците, полагаме хидроизолация и настилка на терасите. Предаваме
        фасадата с документите за вложените материали.
materials_title:
  bg: Системи и материали
materials:
  bg: Работим със системите на Баумит, Rockwool и Knauf. За хидроизолации и лепила използваме Sika и Mapei. Всички
    слоеве са от една система, за да важи гаранцията на производителя. Енергийния одит и сертификата осигуряваме
    с партньори.
projects_title:
  bg: Фасади, които сме изпълнили
faq:
  - q:
      bg: Каква дебелина на изолацията ми трябва?
    a:
      bg: Определя я проектът или енергийният одит според стената и енергийния клас, който
        сградата трябва да достигне. На жилищната сграда „Калия“
        положихме 10 см минерална вата.
  - q:
      bg: Може ли да се прави фасада през зимата?
    a:
      bg: Лепилата и мазилките полагаме при температурите, които разрешава производителят, обикновено над +5 °C за
        въздуха и за стената. Затова планираме фасадите за пролетта, лятото и есента.
  - q:
      bg: Изолирате ли и стари сгради?
    a:
      bg: Да. Фасадата на паметник на културата обновяваме по съгласуван проект за реставрация. Така работихме на
        „Зелената баня“, където положихме фасадна система Баумит.
  - q:
      bg: Как започваме?
    a:
      bg: Пишете ни или ни се обадете. Идваме на оглед и измерваме фасадата, преди да започнем.
cta:
  title:
    bg: Изпратете ни адреса на сградата
  body:
    bg: Идваме на оглед, проверяваме основата и детайлите и Ви казваме коя система подхожда на сградата.
  button:
    bg: Поискайте оглед
