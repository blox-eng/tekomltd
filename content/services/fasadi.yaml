name:
  bg: Фасади и топлоизолация
nav_blurb:
  bg: По-топъл дом и по-ниски сметки за отопление
meta_title:
  bg: Фасади и топлоизолация в Стара Загора
meta_description:
  bg: Саниране, топлоизолация и фасадни мазилки за нови и стари сгради в Стара Загора. Всеки слой по системата на
    производителя. Строим от 1991 г.
h1:
  bg: Фасади и топлоизолация в Стара Загора
intro:
  bg: Добрата фасада пази сградата от влага и вятър, задържа топлината през зимата и прохладата през лятото и изглежда
    добре години наред. Изпълняваме топлоизолация, фасадни мазилки и облицовки на нови сгради и на сгради, които
    се обновяват, с нашия екип и по системата на производителя.
benefits:
  - title:
      bg: По-ниски сметки
    body:
      bg: Топлоизолацията намалява загубата на енергия, така че плащате по-малко за отопление и охлаждане.
  - title:
      bg: Сграда, защитена за години
    body:
      bg: Материали, които пазят стените от влага, вятър и слънце и запазват вида си дълго.
  - title:
      bg: Видимо качество
    body:
      bg: Снимки и протоколи за всеки слой, преди да бъде покрит от следващия.
explainers:
  - title:
      bg: Саниране и топлоизолационни системи (ETICS)
    body:
      bg: 'Санирането обновява сградата отвън: изолация, армировка и нова мазилка, положени като една система. Тази
        система се нарича ETICS — външна топлоизолационна композитна система. Тя работи, когато всеки слой е от един
        производител и е положен по неговите указания. Тогава важат и гаранцията, и изчисленият ефект за енергийния
        клас на сградата.'
  - title:
      bg: Каменна вата или EPS
    body:
      bg: Каменната (минерална) вата е негорима и пропуска водните пари, затова е добрият избор за по-високи сгради
        и за стени, които трябва да „дишат“. EPS (експандиран полистирол) е по-лек и подходящ за повечето жилищни
        сгради. Цокълът, който е в контакт с влага, изолираме с XPS. Дебелината се определя от проекта или енергийния
        одит.
  - title:
      bg: Видове фасадни мазилки
    body:
      bg: Силикатната мазилка пропуска водните пари и е устойчива на мухъл. Силиконовата отблъсква водата и се замърсява
        по-бавно. Минералната е най-близка до традиционните мазилки и обикновено се боядисва. Избираме според сградата,
        изложението и вида, който искате.
steps_title:
  bg: Как изпълняваме фасадата
steps:
  - title:
      bg: Оглед и предложение
    body:
      bg: Оглеждаме сградата, основата и детайлите около прозорците и терасите и предлагаме система, дебелина на изолацията
        и финиш. Количествата идват от проекта и се договарят преди началото.
  - title:
      bg: Скеле и подготовка на основата
    body:
      bg: Монтираме скеле по цялата фасада, за да работим безопасно и да полагаме всеки слой равномерно. После почистваме,
        изравняваме и грундираме стените, за да залепне изолацията без кухини.
  - title:
      bg: Топлоизолация
    body:
      bg: Лепим и дюбелираме топлоизолационните плочи. На жилищната сграда „Калия“ положихме 10 см минерална вата
        по около 1700 м² фасада.
  - title:
      bg: Армировка и обрамчване
    body:
      bg: Шпакловъчен слой с мрежа по цялата фасада и обрамчване на прозорците, за да са здрави ъглите и ръбовете.
  - title:
      bg: Финишна мазилка или облицовка
    body:
      bg: Хидрофобна силикатна мазилка, мазилка Баумит Нанопор или облицовка, например фиброцимент с дървесна структура.
  - title:
      bg: Довършване и предаване
    body:
      bg: Детайли около прозорците и терасите, хидроизолация и настилка на терасите, после предаване с документите
        за вложените материали.
materials_title:
  bg: Системи и материали
materials:
  bg: Работим със системите на Баумит, Rockwool и Knauf, а за хидроизолации и лепила — със Sika и Mapei. Всеки слой
    е от една система, за да важи гаранцията на производителя. Ако имате нужда от енергиен одит и сертификат, ги
    осигуряваме с наши партньори.
projects_title:
  bg: Фасади, които сме изпълнили
faq:
  - q:
      bg: Каква дебелина на изолацията ми трябва?
    a:
      bg: Определя я проектът или енергийният одит според стената и целта за енергиен клас. На жилищната сграда „Калия“
        положихме 10 см минерална вата.
  - q:
      bg: Може ли да се прави фасада през зимата?
    a:
      bg: Лепилата и мазилките се полагат при температури, които производителят разрешава — обикновено над +5 °C за
        въздуха и стената. Затова фасадите планираме за пролетта, лятото и есента.
  - q:
      bg: Изолирате ли и стари сгради?
    a:
      bg: Да. При сграда, която е паметник на културата, фасадата се обновява по съгласуван проект за реставрация
        — както на „Зелената баня“, където положихме фасадна система Баумит.
  - q:
      bg: Как получавам оферта?
    a:
      bg: Пишете ни или се обадете. Идваме на оглед, измерваме фасадата и даваме оферта по количества, преди да започнем.
cta:
  title:
    bg: Обмисляте нова фасада или саниране?
  body:
    bg: Разкажете ни за сградата. Ще дойдем на оглед, преди да дадем оферта.
  button:
    bg: Поискайте оглед
