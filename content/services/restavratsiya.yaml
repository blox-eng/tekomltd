slug: restavratsiya
projects:
  scope: restore
cover_project: green-bath-eye-clinic
name:
  bg: Реставрация на сгради
nav_blurb:
  bg: Стари сгради, запазени и готови за нов живот
meta_title:
  bg: Реставрация на сгради и паметници в Стара Загора
meta_description:
  bg: Реставрация на паметници на културата и стари къщи — фасади, каменна зидария, дървени покриви. „Сребърна фасада
    на годината“ 2025. От 1991 г.
h1:
  bg: Реставрация на сгради в Стара Загора
intro:
  bg: Старата сграда има стойност, която нова не може да повтори. Реставрираме паметници на културата и родови къщи
    така, че да запазят характера си и да заработят отново — като клиника, къща за гости или дом.
benefits:
  - title:
      bg: Запазен характер
    body:
      bg: Възстановяваме това, което прави сградата ценна — фасадата, прозорците, зидарията — по стари снимки и запазени
        детайли.
  - title:
      bg: Удобство на нова сграда
    body:
      bg: Нови инсталации, изолация и функция, вградени така, че да не личат и да не вредят на старата конструкция.
  - title:
      bg: Оценено от професионалистите
    body:
      bg: „Зелената баня“ спечели „Сребърна фасада на годината“ 2025 и беше финалист в Baumit Life Challenge 2026.
explainers:
  - title:
      bg: 'Консервация и реставрация: каква е разликата'
    body:
      bg: Консервацията спира разрушаването и запазва това, което е оцеляло — укрепва зидарията, мазилките и детайлите
        такива, каквито са. Реставрацията възстановява изгубеното по запазени образци, снимки и документи. На една
        сграда обикновено правим и двете.
  - title:
      bg: Паметник на културата
    body:
      bg: Сградите, които са недвижими културни ценности, се ремонтират по проект, съгласуван по Закона за културното
        наследство. Работите се изпълняват по одобрения проект и под надзор, затова планираме графика заедно с проектантите
        от самото начало.
steps_title:
  bg: Как реставрираме
steps:
  - title:
      bg: Проучване
    body:
      bg: Събираме стари снимки и документи и оглеждаме какво е запазено. Родовата къща в Чепеларе възстановихме по
        стари снимки на първата къща от XIX век.
  - title:
      bg: Проект и съгласуване
    body:
      bg: С партньори архитекти и конструктори подготвяме проекта, включително конструктивните изчисления за старата
        сграда.
  - title:
      bg: Конструкция по стария начин
    body:
      bg: Където сградата го изисква, строим като едно време — каменна зидария, дървен гредоред, дървен покрив с керемиди.
        Куполът на параклиса „Св. Димитър“ е изцяло от плътни керамични тухли, със самоносеща конструкция и без стоманобетон.
  - title:
      bg: Фасада и прозорци
    body:
      bg: Консервационно-реставрационни работи по фасадата и възстановени прозорци. На „Зелената баня“ (1929 г., арх.
        Христо Димов) възстановихме южните прозорци и положихме фасадна система Баумит.
  - title:
      bg: Нова функция
    body:
      bg: Преустройваме сградата за новото ѝ предназначение — баня в очен медицински център, родова къща в къща за
        гости с механа.
materials_title:
  bg: Материали
materials:
  bg: Използваме материалите, с които е строена сградата — камък, плътна тухла, дърво, керемиди — и съвременни системи
    само там, където не нарушават облика ѝ.
projects_title:
  bg: Сгради, които сме реставрирали
faq:
  - q:
      bg: Може ли стара къща да се възстанови по снимки?
    a:
      bg: Да. Родовата къща в Чепеларе възстановихме по стари снимки на първата къща на рода от XIX век.
  - q:
      bg: Може ли реставрирана сграда да получи ново предназначение?
    a:
      bg: Да. „Зелената баня“ от 1929 г. днес е очен медицински център, а родовата къща в Чепеларе е къща за гости.
  - q:
      bg: Строите ли и по традиционни технологии?
    a:
      bg: Да. Куполът на параклиса „Св. Димитър“ е изцяло от плътни керамични тухли, със самоносеща конструкция и
        без стоманобетон — както са се строили в миналото.
  - q:
      bg: Как започваме?
    a:
      bg: С оглед на сградата. Казваме Ви какво е запазено, какво е нужно за проекта и откъде да започнем.
cta:
  title:
    bg: Имате стара сграда, която заслужава да бъде запазена?
  body:
    bg: Разкажете ни за нея. Ще дойдем на оглед и ще Ви кажем какво може да се направи.
  button:
    bg: Поискайте оглед
