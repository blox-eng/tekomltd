slug: restavratsiya
projects:
  scope: restore
cover_project: green-bath-eye-clinic
name:
  bg: Реставрация на сгради
nav_blurb:
  bg: Реставрация на паметници на културата и стари къщи
meta_title:
  bg: Реставрация на сгради и паметници в Стара Загора
meta_description:
  bg: 'Реставрация на паметници на културата и стари къщи: фасади, каменна зидария, дървени покриви. „Сребърна фасада
    на годината“ 2025. Строим от 1993 г.'
h1:
  bg: Реставрация на сгради в Стара Загора
intro:
  bg: 'Реставрираме паметници на културата и родови къщи и им даваме ново предназначение: клиника, къща за гости
    или дом. През 2022–2025 г. преустроихме „Зелената баня“ от 1929 г. в очен медицински център.'
benefits:
  - title:
      bg: Къща в Чепеларе, възстановена по стари снимки
    body:
      bg: Родовата къща на ул. „Дичо Петров“ 30 възстановихме през 2004 г. по снимки на първата къща от XIX век. Стените
        са от каменна зидария, покривът е дървен с керемиди.
  - title:
      bg: Тухлен купол без стоманобетон
    body:
      bg: Куполът на параклиса „Св. Димитър“ в двора на Бухчевата къща е иззидан изцяло от плътни керамични тухли
        и се носи сам.
  - title:
      bg: „Сребърна фасада на годината“ 2025
    body:
      bg: Наградата получи „Зелената баня“ (1929 г., арх. Христо Димов). Сградата беше финалист и в Baumit Life Challenge
        2026.
explainers:
  - title:
      bg: 'Консервация и реставрация: каква е разликата'
    body:
      bg: 'Консервацията спира разрушаването и запазва оцелялото: укрепва зидарията, мазилките и детайлите такива,
        каквито са. Реставрацията възстановява изгубеното по запазени образци, снимки и документи. На една сграда
        обикновено правим и двете.'
  - title:
      bg: Паметник на културата
    body:
      bg: Недвижимите културни ценности се ремонтират по проект, съгласуван по Закона за културното наследство.
        Работим по одобрения проект и под надзор. Затова още от самото начало планираме графика заедно с проектантите.
steps_title:
  bg: Как реставрираме
steps:
  - title:
      bg: Проучване
    body:
      bg: Събираме стари снимки и документи и оглеждаме какво е запазено. Родовата къща в Чепеларе възстановихме по
        стари снимки на първата къща от XIX век.
  - title:
      bg: Проект и съгласуване
    body:
      bg: С партньори архитекти и конструктори подготвяме проекта и конструктивните изчисления за старата
        сграда.
  - title:
      bg: Конструкция по стария начин
    body:
      bg: 'Където сградата го изисква, строим както едно време: зидаме с камък, редим дървен гредоред, покриваме
        с керемиди върху дървена конструкция. Куполът на параклиса „Св. Димитър“ е иззидан изцяло от плътни керамични
        тухли и се носи сам, без стоманобетон.'
  - title:
      bg: Фасада и прозорци
    body:
      bg: Изпълняваме консервационно-реставрационни работи по фасадата и възстановяваме прозорците. На „Зелената баня“
        (1929 г., арх. Христо Димов) възстановихме южните прозорци и положихме фасадна система Баумит.
  - title:
      bg: Нова функция
    body:
      bg: Преустройваме сградата за новото ѝ предназначение. Банята стана очен медицински център. Родовата къща в Чепеларе
        днес е къща за гости с механа.
materials_title:
  bg: Материали
materials:
  bg: 'Използваме материалите, с които е построена сградата: камък, плътна тухла, дърво, керемиди. Съвременни системи
    влагаме само там, където не нарушават облика ѝ.'
projects_title:
  bg: Сгради, които сме реставрирали
faq:
  - q:
      bg: Може ли стара къща да се възстанови по снимки?
    a:
      bg: Да. Родовата къща в Чепеларе възстановихме по стари снимки на първата къща на рода от XIX век.
  - q:
      bg: Може ли реставрирана сграда да получи ново предназначение?
    a:
      bg: Да. „Зелената баня“ от 1929 г. днес е очен медицински център, а родовата къща в Чепеларе е къща за гости.
  - q:
      bg: Строите ли и по традиционни технологии?
    a:
      bg: Да. Куполът на параклиса „Св. Димитър“ е иззидан изцяло от плътни керамични тухли и се носи сам, без
        стоманобетон. Така са зидали куполите едно време.
  - q:
      bg: Как започваме?
    a:
      bg: С оглед на сградата. Казваме Ви какво е запазено, какво е нужно за проекта и откъде да започнем.
cta:
  title:
    bg: Разкажете ни за старата сграда
  body:
    bg: Идваме на оглед и Ви казваме какво може да се запази и възстанови.
  button:
    bg: Поискайте оглед
