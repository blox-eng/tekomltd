name:
  bg: Жилищно строителство до ключ
nav_blurb:
  bg: Къщи и жилищни сгради от основите до ключ
meta_title:
  bg: Жилищни сгради и къщи до ключ в Стара Загора
meta_description:
  bg: 'Строеж на къща или жилищна сграда до ключ: конструкция, зидарии, изолации, фасада и довършване. Строим в Стара
    Загора и региона от 1993 г.'
h1:
  bg: Жилищно строителство до ключ в Стара Загора
intro:
  bg: Строим еднофамилни къщи и жилищни сгради от проучването на терена до предаването на ключа и отговаряме
    за целия строеж. През 2021 г. въведохме в експлоатация собствената си сграда с 25 апартамента на ул. „Хаджи
    Димитър Асенов“ 129–131. В Стара Загора и региона строим от 1993 г. и сме членове на Камарата на строителите
    в България.
benefits:
  - title:
      bg: 25 апартамента на „Хаджи Димитър Асенов“
    body:
      bg: Седеметажната сграда на № 129–131 построихме от основите като предприемач. В нея има 5 магазина и гаражи, а
        дограмата е PVC с троен стъклопакет.
  - title:
      bg: Къща на наклонен терен в Остра могила
    body:
      bg: Построихме я през 2014–2016 г. по проект на арх. Радосвета Кирчева. Стените са от Porotherm, фасадите са
        от гнайс и врачански варовик. Къщата има подпорна стена и тераса.
  - title:
      bg: 15 жилищни сгради, около 250 апартамента
    body:
      bg: Финансирахме, построихме и въведохме в експлоатация петнадесет жилищни сгради с обща разгъната застроена
        площ над 30 000 м².
explainers:
  - title:
      bg: 'Строеж на къща: груб строеж или до ключ'
    body:
      bg: Грубият строеж включва основите, конструкцията, зидарията и покрива. Сградата е затворена, но не е готова
        за живеене. Строежът до ключ продължава с изолации, фасада, дограма, инсталации и довършителни работи, докато
        домът стане готов за нанасяне. Строим до ключ, за да отговаряме за целия строеж.
  - title:
      bg: Актовете по време на строежа
    body:
      bg: Всеки етап завършва с документ. Акт 14 приема конструкцията. Акт 15 установява, че строежът е годен за приемане.
        Акт 16 установява, че е годен за ползване, след което се издава разрешение за ползване или удостоверение за
        въвеждане в експлоатация. С партньорите си подготвяме документите от разрешението за строеж до въвеждането
        в експлоатация.
steps_title:
  bg: Как строим
steps:
  - title:
      bg: Проучване
    body:
      bg: Оглеждаме терена, проверяваме местните правила за застрояване и разбираме от какво имате нужда.
  - title:
      bg: Проектиране и разрешения
    body:
      bg: С партньори архитекти и проектанти подготвяме проект, готов за изпълнение, и документите от разрешението
        за строеж до Акт 16.
  - title:
      bg: Конструкция и зидарии
    body:
      bg: Копаем, наливаме основите и стоманобетонната конструкция, зидаме стените.
  - title:
      bg: Покрив, изолации и фасада
    body:
      bg: Покриваме сградата, полагаме топло- и хидроизолациите, монтираме дограмата и изпълняваме фасадата.
  - title:
      bg: Инсталации и довършителни работи
    body:
      bg: Мажем, шпакловаме и боядисваме сами. Електрическите, ВиК и отоплителните инсталации изграждаме с партньори.
        Интериора също правим с партньори, а по-малките интериорни проекти поемаме сами.
  - title:
      bg: Предаване
    body:
      bg: Обхождаме дома с Вас стая по стая и Ви предаваме документите и гаранциите на едно място.
materials_title:
  bg: Материали
materials:
  bg: Строим с материали на Wienerberger, Баумит, Knauf, Rockwool, Sika, Mapei, REHAU и Schüco. Всеки слой полагаме
    по системата на производителя и по българските норми. Материалите са проследими.
projects_title:
  bg: Жилищни сгради и къщи, които сме построили
faq:
  - q:
      bg: Какво включва строеж на дом до ключ?
    a:
      bg: Проучването, проекта с партньори архитекти, разрешенията, конструкцията, покрива, изолациите, фасадата,
        инсталациите и довършителните работи, до приемането стая по стая.
  - q:
      bg: Строите ли извън Стара Загора?
    a:
      bg: Да. Строили сме къщи в Остра могила и Сулица, а други наши обекти са в Чепеларе, Черноморец и Равда.
  - q:
      bg: Помагате ли с проекта и разрешението за строеж?
    a:
      bg: Да. Работим с партньори архитекти и проектанти и координираме проекта и документите вместо Вас.
  - q:
      bg: Строите ли в археологическия резерват?
    a:
      bg: Да. Сградата на ул. „Железни врата“ 18–20 завършихме през 2006 г. в резервата „Августа Траяна“. Римският
        храм от края на II век, открит при разкопките през 2004 г., е запазен под защитно покритие.
cta:
  title:
    bg: Изпратете ни адреса на парцела
  body:
    bg: Отговаряме до един работен ден и идваме да огледаме терена.
  button:
    bg: Поискайте оглед
