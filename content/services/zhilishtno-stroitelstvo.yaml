name:
  bg: Жилищно строителство до ключ
nav_blurb:
  bg: Къща или жилищна сграда с един изпълнител
meta_title:
  bg: Жилищни сгради и къщи до ключ в Стара Загора
meta_description:
  bg: Строеж на къща или жилищна сграда до ключ — конструкция, зидарии, изолации, фасада и довършване. Строим в
    Стара Загора и региона от 1991 г.
h1:
  bg: Жилищно строителство до ключ в Стара Загора
intro:
  bg: Строим еднофамилни къщи и жилищни сгради от проучването на терена до предаването на ключа. При строеж на къща
    или на жилищна сграда имате един изпълнител за целия строеж, ясна цена преди началото и редовни снимки от обекта.
    В Стара Загора и региона строим от 1991 г. и сме членове на Камарата на строителите в България.
benefits:
  - title:
      bg: Цена, на която можете да разчитате
    body:
      bg: Количествата се вземат от проекта и се договарят преди началото, а не се откриват на обекта.
  - title:
      bg: Един изпълнител
    body:
      bg: Строим с нашия екип и координираме архитектите, проектантите и инсталациите вместо Вас.
  - title:
      bg: Нищо скрито
    body:
      bg: Ежедневни снимки и протоколи за всичко, което ще бъде покрито — изолации, хидроизолации, инсталации.
explainers:
  - title:
      bg: 'Строеж на къща: груб строеж или до ключ'
    body:
      bg: Грубият строеж включва основите, конструкцията, зидарията и покрива — сградата е затворена, но не е готова
        за живеене. Строежът до ключ продължава с изолации, фасада, дограма, инсталации и довършителни работи, докато
        домът е готов за нанасяне. Ние строим до ключ, за да отговаряме за целия резултат.
  - title:
      bg: Актовете по време на строежа
    body:
      bg: Всеки етап завършва с документ. Акт 14 приема конструкцията. Акт 15 установява, че строежът е годен за приемане.
        Акт 16 установява, че е годен за ползване, след което се издава разрешение за ползване или удостоверение за
        въвеждане в експлоатация. С партньорите ни подготвяме документите от разрешението за строеж до въвеждането
        в експлоатация.
steps_title:
  bg: Как строим
steps:
  - title:
      bg: Проучване
    body:
      bg: Опознаваме терена, местните правила за застрояване, нуждите Ви и бюджета, преди да предложим решение.
  - title:
      bg: Проектиране и разрешения
    body:
      bg: С доверени партньори архитекти и проектанти подготвяме проект, готов за изпълнение, и документите от разрешението
        за строеж до Акт 16.
  - title:
      bg: Конструкция и зидарии
    body:
      bg: Изкоп, основи, стоманобетонна конструкция и зидария.
  - title:
      bg: Покрив, изолации и фасада
    body:
      bg: Покрив, топло- и хидроизолации, дограма и фасада.
  - title:
      bg: Инсталации и довършителни работи
    body:
      bg: Мазилки, шпакловка и боядисване, а електро-, ВиК и отоплителните инсталации изпълняваме с наши партньори.
        Интериора изпълняваме с партньори, а по-малките проекти поемаме сами.
  - title:
      bg: Предаване
    body:
      bg: Приемане стая по стая, с документи и гаранции на едно място.
materials_title:
  bg: Материали
materials:
  bg: Строим с материали на Wienerberger, Баумит, Knauf, Rockwool, Sika, Mapei, REHAU и Schüco. Всеки слой е изпълнен
    по системата на производителя и българските норми, с проследими материали.
projects_title:
  bg: Жилищни сгради и къщи, които сме построили
faq:
  - q:
      bg: Какво включва строеж на дом до ключ?
    a:
      bg: Проучването, проекта с наши партньори архитекти, разрешенията, конструкцията, покрива, изолациите, фасадата,
        инсталациите и довършителните работи — до приемането стая по стая.
  - q:
      bg: Строите ли извън Стара Загора?
    a:
      bg: Да. Строили сме къщи в Остра могила и Сулица, а други наши обекти са в Чепеларе, Черноморец и Равда.
  - q:
      bg: Помагате ли с проекта и разрешението за строеж?
    a:
      bg: Да. Работим с доверени архитекти и проектанти и координираме проекта и документите вместо Вас.
  - q:
      bg: Как се определя цената?
    a:
      bg: По количествата от проекта. Договаряме ги преди началото, за да няма изненади на обекта.
cta:
  title:
    bg: Планирате къща или жилищна сграда?
  body:
    bg: Разкажете ни за проекта. Отговаряме до един работен ден и оглеждаме терена, преди да дадем оферта.
  button:
    bg: Поискайте оферта
