# Single source of truth for the Netlify build (site: tekomltd-website).
[build]
  base = "apps/website"
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm content:check && pnpm sync-media && pnpm exec next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
