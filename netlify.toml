# Single source of truth for the Netlify build (site: tekomltd-website).
[build]
  base = "apps/website"
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm content:check && pnpm sync-media && pnpm share-images && pnpm exec next build"
  publish = ".next"
  # Netlify's default skips a build when nothing under `base` changed, but content/ and other
  # build inputs live at the repo root. The script also builds when there is no earlier commit to compare with.
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Share images are named by their content (scripts/share-images.ts): a new image gets a new URL.
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
