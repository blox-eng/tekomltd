# Single source of truth for the Netlify build (site: tekomltd-website).
[build]
  base = "apps/website"
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm content:check && pnpm sync-media && pnpm share-images && pnpm exec next build"
  publish = ".next"
  # Netlify's default skips a build when nothing under `base` changed, but content/ and the
  # other inputs below live at the repo root. Exit 0 skips, 1 builds.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../content ../../packages ../../design/wordpress-snapshot ../../package.json ../../pnpm-lock.yaml ../../netlify.toml"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Share images are named by their content (scripts/share-images.ts): a new image gets a new URL.
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
